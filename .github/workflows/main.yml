name: ap_materiais_graficas
description: Sistema de vendas offline - AP Materiais Gráficas
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados offline
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Arquivos e armazenamento
  path_provider: ^2.1.5
  path: ^1.9.1

  # Datas e valores
  intl: ^0.20.2

  # WhatsApp e links
  url_launcher: ^6.3.2

  # Gerar imagem do pedido
  screenshot: ^3.0.0
  image: ^4.5.4

  # Compartilhar arquivos
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Geração dos arquivos do Isar
  build_runner: ^2.5.4
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
