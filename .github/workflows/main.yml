name: Gerar APK - AP Materiais Graficas

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf app_project
          mkdir -p app_project

          unzip -q "$ZIP" -d app_project

          echo "Projeto extraido."

      - name: Encontrar projeto Flutter
        shell: bash
        run: |
          set -e

          PUBSPEC="$(find app_project -type f -name pubspec.yaml | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml nao encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Projeto Flutter encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corrigir url_launcher
        shell: bash
        run: |
          set -e

          echo "Corrigindo url_launcher..."

          sed -i 's/url_launcher: \^6\.3\.3/url_launcher: ^6.3.2/g' "$PROJECT_DIR/pubspec.yaml"

          echo "Dependencia atual:"
          grep "url_launcher" "$PROJECT_DIR/pubspec.yaml"

      - name: Preparar projeto Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create . \
            --platforms=android \
            --project-name ap_materiais_graficas

      - name: Instalar dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Garantir ferramentas de geracao
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dart pub add --dev build_runner:^2.5.4
          dart pub add --dev isar_community_generator:^3.3.2
          flutter pub get

      - name: Gerar arquivos Isar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AP-Materiais-Graficas-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
